name: Arinana_Auto_Service API CI/CD Pipeline

on:
  push:
    branches:
      - Dev-Farazdaq
      - Testing
      - main

jobs:
  # ============================
  # CI JOB
  # ============================
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none

      - name: Prepare .env for CI
        run: |
          cp .env.example .env || true
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=database/database.sqlite" >> .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=ext-grpc

      - name: Generate Laravel app key
        run: php artisan key:generate

      - name: Create SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

  # ============================
  # LIVE DEPLOY (main branch)
  # ============================
  deploy-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Live Server
        run: |
          ssh -o StrictHostKeyChecking=no -p 65002 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -euxo pipefail

          DEPLOY_DIR="/home/u978867526/domains/arianaautoservice.com/public_html/Arinana_Live_Api"
          REPO_URL="git@github.com:sleekdxb/arinana-auto-service-api.git"
          BRANCH="main"

          echo "Deploying LIVE (main)..."

          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            if [ -d "$DEPLOY_DIR" ] && [ -n "$(ls -A "$DEPLOY_DIR")" ]; then
              echo "Existing files without git, attaching repo in place..."
              cd "$DEPLOY_DIR"
              git init
              git remote add origin "$REPO_URL"
            else
              echo "First time clone..."
              git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
            fi
          fi

          cd "$DEPLOY_DIR"

          if [ -f .env ]; then
            mkdir -p "$HOME/env-backups"
            cp .env "$HOME/env-backups/$(basename "$DEPLOY_DIR")-$(date +%F-%H%M%S).env"
          fi

          git remote set-url origin "$REPO_URL"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          git checkout -B "$BRANCH"

          if [ ! -f .env ]; then
            echo ".env is missing in $DEPLOY_DIR, create it before deploying"
            exit 1
          fi

          php artisan config:clear
          php artisan config:cache
          php artisan route:cache

          echo "LIVE Deployment Complete"
          EOF

  # ============================
  # TESTING DEPLOY (Testing-Server branch)
  # ============================
  deploy-testing:
    if: github.ref == 'refs/heads/Testing'
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Testing
        run: |
          ssh -o StrictHostKeyChecking=no -p 65002 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          set -euxo pipefail

          DEPLOY_DIR="/home/u978867526/domains/arianaautoservice.com/public_html/Arinana_Testing_Api"
          REPO_URL="git@github.com:sleekdxb/arinana-auto-service-api.git"
          BRANCH="Testing"

          echo "Deploying TESTING (Testing-Server)..."

          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            if [ -d "$DEPLOY_DIR" ] && [ -n "$(ls -A "$DEPLOY_DIR")" ]; then
              echo "Existing files without git, attaching repo in place..."
              cd "$DEPLOY_DIR"
              git init
              git remote add origin "$REPO_URL"
            else
              echo "First time clone..."
              git clone -b "$BRANCH" "$REPO_URL" "$DEPLOY_DIR"
            fi
          fi

          cd "$DEPLOY_DIR"

          if [ -f .env ]; then
            mkdir -p "$HOME/env-backups"
            cp .env "$HOME/env-backups/$(basename "$DEPLOY_DIR")-$(date +%F-%H%M%S).env"
          fi

          git remote set-url origin "$REPO_URL"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          git checkout -B "$BRANCH"

          if [ ! -f .env ]; then
            echo ".env is missing in $DEPLOY_DIR, create it before deploying"
            exit 1
          fi

          php artisan config:clear
          php artisan config:cache
          php artisan route:cache

          echo "TESTING Deployment Complete"
          EOF
